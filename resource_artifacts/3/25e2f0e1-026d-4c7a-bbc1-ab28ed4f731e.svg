<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-label="知识步骤动画"><rect width="100%" height="100%" fill="white"/><text x="35" y="45" font-size="24">知识步骤演示</text><g><rect x="20" y="75" width="860" height="58" rx="10" fill="#dce8ff"><animate attributeName="opacity" values="0.25;1;0.25" dur="12s" begin="0s" repeatCount="indefinite"/></rect><text x="35" y="112" font-size="19">1. 计算机组成原理个性化课件</text></g><g><rect x="20" y="150" width="860" height="58" rx="10" fill="#dce8ff"><animate attributeName="opacity" values="0.25;1;0.25" dur="12s" begin="2s" repeatCount="indefinite"/></rect><text x="35" y="187" font-size="19">2. 课程导入</text></g><g><rect x="20" y="225" width="860" height="58" rx="10" fill="#dce8ff"><animate attributeName="opacity" values="0.25;1;0.25" dur="12s" begin="4s" repeatCount="indefinite"/></rect><text x="35" y="262" font-size="19">3. 同学们，我们先来想一个场景：你正在用电脑写作业，突然卡住了，鼠标转圈圈。你心里想：“是CPU不够快？还是内存不够用？还是硬盘读写太慢？”——</text></g><g><rect x="20" y="300" width="860" height="58" rx="10" fill="#dce8ff"><animate attributeName="opacity" values="0.25;1;0.25" dur="12s" begin="6s" repeatCount="indefinite"/></rect><text x="35" y="337" font-size="19">4. 今天这节课，我们就从最基础的概念出发，把计算机的“骨架”和“血脉”理清楚。别担心，我会带着你一步步走，就像拼乐高一样，先认识零件，再理解它们</text></g><g><rect x="20" y="375" width="860" height="58" rx="10" fill="#dce8ff"><animate attributeName="opacity" values="0.25;1;0.25" dur="12s" begin="8s" repeatCount="indefinite"/></rect><text x="35" y="412" font-size="19">5. 学习目标</text></g><g><rect x="20" y="450" width="860" height="58" rx="10" fill="#dce8ff"><animate attributeName="opacity" values="0.25;1;0.25" dur="12s" begin="10s" repeatCount="indefinite"/></rect><text x="35" y="487" font-size="19">6. 学完这节课，你应该能：</text></g></svg>