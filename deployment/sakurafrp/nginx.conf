worker_processes  1;
pid logs/nginx.pid;
error_log logs/error.log warn;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25m;
    access_log logs/access.log combined;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 127.0.0.1:80;
        server_name _;
        root html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # API docs are for local diagnostics and must not be served via the tunnel.
        location ~ ^/api/[^/]+/(docs|redoc|openapi\.json)(/|$) { return 404; }

        # A trailing slash on proxy_pass strips only the service prefix. FastAPI
        # receives its existing paths, e.g. /api/user/users/login -> /users/login.
        location /api/user/ {
            proxy_pass http://127.0.0.1:8001/;
            include proxy-common.conf;
        }
        location = /_auth {
            internal;
            proxy_pass http://127.0.0.1:8001/users/me;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }
        location = /api/agent/health {
            proxy_pass http://127.0.0.1:8002/health;
        }
        location /api/agent/ {
            auth_request /_auth;
            proxy_pass http://127.0.0.1:8002/;
            include proxy-common.conf;
            proxy_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering no always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }
        location /api/resource/ {
            proxy_pass http://127.0.0.1:8003/;
            include proxy-common.conf;
        }
        location /api/evaluation/ {
            proxy_pass http://127.0.0.1:8004/;
            include proxy-common.conf;
        }
        location /api/teacher/ {
            proxy_pass http://127.0.0.1:8005/;
            include proxy-common.conf;
        }
        location /api/system/ {
            proxy_pass http://127.0.0.1:8006/;
            include proxy-common.conf;
        }

        location /api/ { return 404; }
        location /assets/ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }
    }
}
