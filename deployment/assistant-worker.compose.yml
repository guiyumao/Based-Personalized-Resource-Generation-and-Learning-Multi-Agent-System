# Overlay: docker compose -p learning -f docker-compose.yml -f deployment/assistant-worker.compose.yml up -d agent-service assistant-worker
services:
  agent-service:
    environment:
      ASSISTANT_TASK_EXECUTION_MODE: worker

  assistant-worker:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install -e . && python -m services.agent_service.app.services.assistant_worker"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASSISTANT_TASK_EXECUTION_MODE: worker
      CHROMA_MODE: http
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    volumes:
      - .:/app
    depends_on:
      - agent-service
      - postgres
      - chroma
      - neo4j
